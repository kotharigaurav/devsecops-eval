name: Add IAM Access to EKS (aws-auth)

on:
  workflow_dispatch:
    inputs:
      iam_principal:
        description: 'IAM principal ARN to add (user or role)'
        required: true
      username:
        description: 'Kubernetes username to assign'
        required: false
        default: 'dev-user'
      groups:
        description: 'Comma-separated Kubernetes groups (e.g. system:masters)'
        required: false
        default: 'system:masters'
      cluster_name:
        description: 'EKS cluster name'
        required: false
        default: 'devsecops-eks'
      region:
        description: 'AWS region'
        required: false
        default: 'ap-south-1'

jobs:
  add-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ github.event.inputs.region }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: add-iam-access

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ github.event.inputs.region }} --name ${{ github.event.inputs.cluster_name }}

      - name: Show current aws-auth
        run: |
          echo '--- current aws-auth ---'
          kubectl get configmap aws-auth -n kube-system -o yaml || echo 'aws-auth not found'

      - name: Patch aws-auth to add principal
        env:
          IAM_PRINCIPAL: ${{ github.event.inputs.iam_principal }}
          USERNAME: ${{ github.event.inputs.username }}
          GROUPS: ${{ github.event.inputs.groups }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, yaml

          iam = os.environ.get('IAM_PRINCIPAL')
          username = os.environ.get('USERNAME', 'dev-user')
          groups = [g.strip() for g in os.environ.get('GROUPS','system:masters').split(',') if g.strip()]

          if not iam:
              print('IAM_PRINCIPAL required', file=sys.stderr); sys.exit(1)

          # fetch current configmap
          p = subprocess.run(['kubectl','get','configmap','aws-auth','-n','kube-system','-o','yaml'], capture_output=True, text=True)
          if p.returncode != 0:
              print('Failed to get aws-auth configmap:', p.stderr, file=sys.stderr); sys.exit(p.returncode)

          cm = yaml.safe_load(p.stdout)
          data = cm.get('data', {})

          def parse_map(field):
              s = data.get(field, '')
              if not s:
                  return []
              try:
                  return yaml.safe_load(s)
              except Exception:
                  return []

          users = parse_map('mapUsers')
          roles = parse_map('mapRoles')

          # If iam ARN looks like role or user
          entry = None
          if ':role/' in iam:
              # map role
              entry = {'rolearn': iam, 'username': username, 'groups': groups}
              exists = any(r.get('rolearn')==iam for r in roles if isinstance(r, dict))
              if exists:
                  print('Role mapping already exists for', iam); sys.exit(0)
              roles.append(entry)
              data['mapRoles'] = yaml.safe_dump(roles, default_flow_style=False)
          else:
              # map user
              entry = {'userarn': iam, 'username': username, 'groups': groups}
              exists = any(u.get('userarn')==iam for u in users if isinstance(u, dict))
              if exists:
                  print('User mapping already exists for', iam); sys.exit(0)
              users.append(entry)
              data['mapUsers'] = yaml.safe_dump(users, default_flow_style=False)

          cm['data'] = data
          out = 'patched-aws-auth.yaml'
          with open(out,'w') as f:
              yaml.safe_dump(cm,f)

          ap = subprocess.run(['kubectl','apply','-f',out], capture_output=True, text=True)
          print(ap.stdout)
          print(ap.stderr, file=sys.stderr)
          sys.exit(ap.returncode)
          PY

      - name: Show new aws-auth
        run: |
          echo '--- patched aws-auth ---'
          kubectl get configmap aws-auth -n kube-system -o yaml

      - name: Verify access (whoami)
        run: |
          kubectl auth can-i get nodes || true
