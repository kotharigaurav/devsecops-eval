name: EKS Diagnose Nodegroup

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: 'EKS cluster name'
        required: false
        default: 'devsecops-eks'
      region:
        description: 'AWS region'
        required: false
        default: 'ap-south-1'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ github.event.inputs.region }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: eks-diagnose

      - name: Tools versions
        run: |
          aws --version
          kubectl version --client --short || true

      - name: Show AWS identity and region
        run: |
          echo "Region: ${{ github.event.inputs.region }}"
          aws sts get-caller-identity

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ github.event.inputs.region }} --name ${{ github.event.inputs.cluster_name }}

      - name: Describe cluster
        run: |
          echo '--- describe-cluster ---'
          aws eks describe-cluster --name ${{ github.event.inputs.cluster_name }} || true

      - name: List nodegroups
        run: |
          echo '--- list-nodegroups ---'
          aws eks list-nodegroups --cluster-name ${{ github.event.inputs.cluster_name }} || true

      - name: Describe each nodegroup (if any)
        run: |
          for ng in $(aws eks list-nodegroups --cluster-name ${{ github.event.inputs.cluster_name }} --query 'nodegroups' --output text || true); do
            echo "--- describe-nodegroup: $ng ---"
            aws eks describe-nodegroup --cluster-name ${{ github.event.inputs.cluster_name }} --nodegroup-name $ng || true
          done

      - name: List EC2 instances tagged for this cluster
        run: |
          CL=${{ github.event.inputs.cluster_name }}
          echo "Looking for EC2 instances tagged kubernetes.io/cluster/$CL"
          aws ec2 describe-instances --filters "Name=tag:kubernetes.io/cluster/$CL,Values=owned,shared" --query 'Reservations[].Instances[].[InstanceId,State.Name,Tags]' --output json || true

      - name: Show autoscaling groups for the cluster (by tag)
        run: |
          CL=${{ github.event.inputs.cluster_name }}
          aws autoscaling describe-auto-scaling-groups --query "AutoScalingGroups[?contains(Tags[?Key=='kubernetes.io/cluster/$CL'].Value, 'owned') || contains(Tags[?Key=='kubernetes.io/cluster/$CL'].Value, 'shared')].{Name:AutoScalingGroupName,Tags:Tags,Instances:Instances}" --output json || true

      - name: kubectl view nodes and pods
        run: |
          kubectl config current-context || true
          kubectl get nodes -o wide || true
          kubectl get pods -A || true
